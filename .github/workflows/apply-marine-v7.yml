name: Apply approved marine v7 overlay

on:
  push:
    branches: [marine-art-v7-approved-concepts]
    paths: [.github/workflows/apply-marine-v7.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marine-art-v7-approved-concepts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inject v7 overlay loader
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'assets/fish-refresh.js';
          let src = fs.readFileSync(file, 'utf8');
          if (!src.includes('fish-approved-v7.js')) {
            const marker = '\n})();';
            const at = src.lastIndexOf(marker);
            if (at < 0) throw new Error('fish-refresh closure not found');
            const loader = `\n  // Approved concept-art overlay: surface fish + angler only.\n  var approvedV7 = document.createElement('script');\n  approvedV7.src = 'assets/fish-approved-v7.js';\n  approvedV7.async = false;\n  document.head.appendChild(approvedV7);`;
            src = src.slice(0, at) + loader + src.slice(at);
            fs.writeFileSync(file, src);
          }
          NODE
          node --check assets/fish-refresh.js
          node --check assets/fish-approved-v7.js
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fish-refresh.js
          git commit -m "Load approved v7 marine artwork"
          git push origin HEAD:marine-art-v7-approved-concepts
