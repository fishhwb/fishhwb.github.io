name: Probe public VRChat world indexes
on:
  push:
    paths:
      - '.github/workflows/probe-vrcmap.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve VRCDB world redirects
        shell: bash
        run: |
          set -u
          while IFS='|' read -r name url; do
            echo "=== $name ==="
            curl -sS -o /dev/null -D - "$url" | grep -iE '^(HTTP/|location:)' || true
            echo 'FINAL:'
            curl -LsS -o /dev/null -w '%{url_effective}\n' "$url" || true
          done <<'EOF'
          Echo Reef|https://vrcdb.com/go/world/w2Jc2qvuN15DBw0Y4NAs_uKWVcbm5SXFYfTgw9TZpKn6jpFPAUNOx6cwVbDzoxoDWg6EiqQQE7wbJiSmLTdI-VqPbTbLWT
          Marked Realms|https://vrcdb.com/go/world/w2eFtAw5z2c_YZhNJ23UqJKY8eSzBN6Mi4umOREViEjOkhpqsS01yPxNLnTWvuO09-xQkC2jl6QWpVz8UXnin7bNDmLfX9
          Greggs|https://vrcdb.com/go/world/w2KCKWtmzlYLBB7S0RzbI1T_Nt0JAJrSbdlMjqh2zpLNCH-1sCt9dx7-1-Vf8HwmZNuRaxWy5u6Qc1mD8wLGLyxRs0w4HF
          Ded Haven|https://vrcdb.com/go/world/w248lecMx38ZllRSn7iGfVKmGfKDFSwFXZzdgus1jdnE7eMen3XqhxGsGmxM8qhWKCGIPhfWB5idblDB_dGGXyRoEjnXS5
          Murder Party|https://vrcdb.com/go/world/w2jUASvg_bbtYX52PUNhHUp75OrA2a-Admvq2wPUB5wvh5K5bobr5lJONUtbkDoF0ByuekZauSXdI4MzmZVbFqSJJ3fL6M
          DayScare|https://vrcdb.com/go/world/w2oYVV17MMwgdpV0oNifVXk7yswEBcav_TAVvw-0YXgzQF7PZxPInH40ohYDm0yclsM6ELqsmAjQzotD24JnvF8Ko5el77
          EOF
