name: Probe public VRChat world indexes
on:
  push:
    paths:
      - '.github/workflows/probe-vrcmap.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Search VRCDB by author
        shell: bash
        run: |
          python -m pip install --quiet selenium
          python - <<'PY'
          import re, time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          options = webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-gpu')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1200')
          driver = webdriver.Chrome(options=options)
          try:
              driver.get('https://vrcdb.com/worlds')
              wait = WebDriverWait(driver, 25)
              author = wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR, '.search-btn-author')))
              author.click()
              box = wait.until(EC.element_to_be_clickable((By.CSS_SELECTOR, '.search-input')))
              box.clear()
              box.send_keys('DedZedOffishal')
              box.send_keys(Keys.ENTER)
              time.sleep(8)
              html = driver.page_source
              print('URL', driver.current_url)
              print('TITLE', driver.title)
              print('AUTHOR_BUTTON', driver.find_element(By.CSS_SELECTOR,'.search-btn-author').get_attribute('class'))
              ids = sorted(set(re.findall(r'wrld_[0-9a-fA-F-]{36}', html)))
              print('WORLD_IDS', len(ids))
              for wid in ids: print(wid)
              print('=== RESULT LINKS/TEXT ===')
              for a in driver.find_elements(By.CSS_SELECTOR, 'a[href]'):
                  href=a.get_attribute('href') or ''
                  text=(a.text or '').strip().replace('\n',' | ')
                  if 'world' in href.lower() or 'wrld_' in href or 'DedZed' in text:
                      print('LINK', href, 'TEXT', text[:500])
              print('=== RESULT CARDS ===')
              for sel in ['.world-card','.avatar-card','.search-result','.card','article']:
                  cards=driver.find_elements(By.CSS_SELECTOR,sel)
                  if cards:
                      print('SELECTOR',sel,'COUNT',len(cards))
                      for c in cards[:100]:
                          t=(c.text or '').strip().replace('\n',' | ')
                          if t: print('CARD',t[:1000])
              print('=== BODY MATCHES ===')
              body=(driver.find_element(By.TAG_NAME,'body').text or '')
              for line in body.splitlines():
                  if 'DedZed' in line or 'Greggs' in line or 'Echo Reef' in line or 'Ded Haven' in line:
                      print(line[:1000])
          finally:
              driver.quit()
          PY
