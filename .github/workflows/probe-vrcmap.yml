name: Probe public VRChat world indexes
on:
  push:
    paths:
      - '.github/workflows/probe-vrcmap.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe VRCmap with Chrome
        shell: bash
        run: |
          set -u
          echo '=== chrome ==='
          command -v google-chrome || command -v chromium || command -v chromium-browser || true
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom 'https://vrcmap.com/?search=DedZedOffishal' > /tmp/vrcmap-dom.html 2>/tmp/chrome.err || true
            echo '--- browser stderr ---'
            tail -100 /tmp/chrome.err || true
            echo '--- matching DOM text ---'
            grep -oiE '.{0,100}(DedZedOffishal|Greggs|Echo Reef|Ded Haven|wrld_[0-9a-f-]{36}).{0,180}' /tmp/vrcmap-dom.html | head -100 || true
            echo '--- world ids ---'
            grep -oE 'wrld_[0-9a-f-]{36}' /tmp/vrcmap-dom.html | sort -u | head -200 || true
          fi
          echo '=== direct cached searches ==='
          for term in Greggs 'Echo%20Reef' 'Ded%20Haven'; do
            echo "--- $term"
            curl -LsS "https://vrcavatarsearch.nekosunevr.co.uk/api/v1/worlds/search?search=$term" | head -c 12000
            echo
          done
