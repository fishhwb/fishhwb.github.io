name: Hotfix marine v7 loading

on:
  push:
    branches: [marine-v7-live-hotfix]
    paths: [.github/workflows/hotfix-marine-v7.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marine-v7-live-hotfix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch surface selectors and direct v7 loading
        run: |
          node <<'NODE'
          const fs = require('fs');

          const jsPath = 'assets/fish-approved-v7.js';
          let js = fs.readFileSync(jsPath, 'utf8');
          const oldSel = "document.querySelectorAll('.critter.clown')";
          const newSel = "document.querySelectorAll('.critter.clown, .critter.tang')";
          if (!js.includes(newSel)) {
            if (!js.includes(oldSel)) throw new Error('surface selector not found');
            js = js.replace(oldSel, newSel);
            fs.writeFileSync(jsPath, js);
          }

          const indexPath = 'index.html';
          let html = fs.readFileSync(indexPath, 'utf8');
          const refresh = '<script src="assets/fish-refresh.js" defer></script>';
          const direct = '<script src="assets/fish-approved-v7.js?v=7.1" defer></script>';
          if (!html.includes(direct)) {
            if (!html.includes(refresh)) throw new Error('fish-refresh script tag not found');
            html = html.replace(refresh, refresh + '\n' + direct);
            fs.writeFileSync(indexPath, html);
          }
          NODE
          node --check assets/fish-approved-v7.js
          grep -q 'fish-approved-v7.js?v=7.1' index.html
          grep -q "critter.clown, .critter.tang" assets/fish-approved-v7.js
      - name: Commit hotfix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fish-approved-v7.js index.html
          git commit -m "Fix approved marine v7 live loading"
          git push origin HEAD:marine-v7-live-hotfix
