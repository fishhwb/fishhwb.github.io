name: Finalize site v2 branch

on:
  push:
    branches: [site-v2-selected-upgrades]
    paths:
      - '.github/workflows/finalize-site-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-v2-selected-upgrades
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make enhanced renderers win legacy async races
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/site-v2.js')
          s = p.read_text()
          old = """    lazyMedia();renderWorlds();renderGallery();setupRelics();addPlankton();useOptimizedMascot();\n    projectDataPromise.then(function(data){renderProjects(data);upgradeBuddy(data);});"""
          new = """    lazyMedia();renderGallery();setupRelics();addPlankton();useOptimizedMascot();\n    projectDataPromise.then(function(data){\n      upgradeBuddy(data);\n      // extras.js starts its local JSON requests after this script. Give it a moment to\n      // finish, then make the richer project/world render the final DOM state.\n      setTimeout(function(){renderProjects(data);renderWorlds();}, 900);\n    });"""
          if old not in s:
              raise SystemExit('Expected site-v2 initialization block was not found')
          p.write_text(s.replace(old,new))
          PY

      - name: Regenerate project metadata with display overrides
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-site-content.mjs

      - name: Validate generated site code
        shell: bash
        run: |
          node --check assets/site-v2.js
          node --check assets/fish-refresh.js
          node --check .github/scripts/build-site-content.mjs
          node --check .github/scripts/update-vrchat-worlds.mjs
          python -m json.tool assets/projects.json >/dev/null
          python -m json.tool assets/gallery.json >/dev/null
          python -m json.tool assets/vrchat-worlds.json >/dev/null
          grep -q 'Disallow: /terms-of-friendship/' robots.txt
          grep -q 'noindex,nofollow,noarchive' terms-of-friendship/index.html
          grep -q 'assets/site-v2.js' index.html
          grep -q 'assets/fish-refresh.js' index.html
          grep -q 'data-src="https://player.twitch.tv/' index.html

      - name: Remove this one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/finalize-site-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize and validate selected site v2 upgrades"
          git push
