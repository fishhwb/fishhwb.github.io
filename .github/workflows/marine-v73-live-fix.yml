name: Marine v7.3 live rendering fix

on:
  push:
    branches: [marine-v73-actual-size-fix]
    paths: [.github/workflows/marine-v73-live-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marine-v73-actual-size-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix actual on-site fish scale and abyss anchoring
        run: |
          python <<'PY'
          from pathlib import Path

          css_path = Path('assets/fish-approved-v7.css')
          css = css_path.read_text()
          marker = '/* v7.3: actual on-site scale/contrast fix */'
          if marker not in css:
              css += r'''

/* v7.3: actual on-site scale/contrast fix */
.critter[data-approved-art="7"]{
  width:clamp(150px,calc(var(--size) * 3.05),240px);
  overflow:visible;
}
.critter[data-approved-art="7"]::after{
  left:-10%;top:-8%;width:120%;height:116%;
  background:radial-gradient(ellipse,rgba(239,255,255,.25),rgba(91,223,255,.13) 35%,rgba(255,141,206,.075) 58%,transparent 76%);
  filter:blur(24px);
}
.critter[data-approved-art="7"] .approved-surface-fish{
  filter:saturate(1.35) contrast(1.1) drop-shadow(0 0 9px rgba(217,253,255,.36)) drop-shadow(0 0 22px rgba(89,215,255,.18)) drop-shadow(0 12px 20px rgba(0,0,0,.16));
}
.critter[data-approved-art="7"] .approved-body{mix-blend-mode:normal;opacity:.98}
.critter[data-approved-art="7"] .approved-scale{stroke-opacity:.52}
.critter[data-approved-art="7"] .approved-vein{stroke-opacity:.68;filter:drop-shadow(0 0 2px currentColor)}
.critter[data-approved-art="7"] .approved-dorsal,
.critter[data-approved-art="7"] .approved-streamer,
.critter[data-approved-art="7"] .approved-ventral,
.critter[data-approved-art="7"] .approved-pectoral,
.critter[data-approved-art="7"] .approved-tail{filter:drop-shadow(0 0 4px rgba(191,246,255,.18))}

.angler[data-approved-art="7"]{
  width:clamp(300px,34vw,400px);
  height:auto;
  aspect-ratio:285 / 195;
  max-width:none;
  filter:saturate(1.22) contrast(1.12) drop-shadow(0 0 14px rgba(146,183,255,.25)) drop-shadow(0 0 34px rgba(255,150,216,.14)) drop-shadow(0 18px 32px rgba(0,0,0,.38));
}
.angler[data-approved-art="7"] .approved-lure-core{filter:drop-shadow(0 0 9px #ffd9ef) drop-shadow(0 0 25px #ffbce2) drop-shadow(0 0 44px #927cff)}
.angler[data-approved-art="7"] .approved-organ{filter:drop-shadow(0 0 8px rgba(255,161,208,.32))}
.angler[data-approved-art="7"] .approved-teeth{filter:drop-shadow(0 0 2px rgba(225,249,255,.35))}
.abyss .dark{
  -webkit-mask:radial-gradient(circle 250px at var(--lx,50%) var(--ly,50%),transparent 27%,#000 100%);
  mask:radial-gradient(circle 250px at var(--lx,50%) var(--ly,50%),transparent 27%,#000 100%);
}

@keyframes approved-scale{from{opacity:.3}to{opacity:.78}}
@keyframes approved-vein{from{opacity:.32}to{opacity:.88}}
@keyframes approved-core{from{opacity:.5;transform:scale(.94)}to{opacity:.94;transform:scale(1.07)}}

@media(max-width:700px){
  .critter[data-approved-art="7"]{width:clamp(125px,calc(var(--size) * 2.55),185px)}
  .angler[data-approved-art="7"]{width:clamp(250px,68vw,320px)}
  .abyss .dark{-webkit-mask:radial-gradient(circle 205px at var(--lx,50%) var(--ly,50%),transparent 27%,#000 100%);mask:radial-gradient(circle 205px at var(--lx,50%) var(--ly,50%),transparent 27%,#000 100%)}
}
'''
          css_path.write_text(css)

          refresh_path = Path('assets/fish-refresh.js')
          refresh = refresh_path.read_text()
          refresh = refresh.replace("assets/fish-approved-v7.css?v=7.2", "assets/fish-approved-v7.css?v=7.3")
          old = "a.setAttribute('viewBox','0 0 285 195');\n      a.innerHTML=anglerArt();"
          new = "a.setAttribute('viewBox','0 0 285 195');\n      a.setAttribute('width','285');\n      a.setAttribute('height','195');\n      a.innerHTML=anglerArt();"
          if old not in refresh and "a.setAttribute('width','285');" not in refresh:
              raise SystemExit('angler sizing insertion point missing')
          refresh = refresh.replace(old, new)
          refresh_path.write_text(refresh)

          sea_path = Path('assets/sea.js')
          sea = sea_path.read_text()
          old_constants = "var LURE_X = 150, LURE_Y = 14;"
          new_constants = "var LURE_X_RATIO = 242 / 285, LURE_Y_RATIO = 85 / 195;"
          if old_constants not in sea and 'LURE_X_RATIO' not in sea:
              raise SystemExit('old lure constants missing')
          sea = sea.replace(old_constants, new_constants)
          old_transform = "angler.style.transform = 'translate(' + (lx - LURE_X * flip) + 'px,' + (ly - LURE_Y) + 'px) scaleX(' + flip + ')';"
          new_transform = "var lureX = angler.clientWidth * LURE_X_RATIO, lureY = angler.clientHeight * LURE_Y_RATIO;\n      angler.style.transform = 'translate(' + (lx - lureX * flip) + 'px,' + (ly - lureY) + 'px) scaleX(' + flip + ')';"
          if old_transform not in sea and 'var lureX = angler.clientWidth' not in sea:
              raise SystemExit('angler transform insertion point missing')
          sea = sea.replace(old_transform, new_transform)
          sea_path.write_text(sea)

          index_path = Path('index.html')
          html = index_path.read_text().replace('assets/fish-refresh.js?v=7.2', 'assets/fish-refresh.js?v=7.3')
          index_path.write_text(html)
          PY
          node --check assets/fish-refresh.js
          node --check assets/sea.js
          grep -q 'v7.3: actual on-site scale/contrast fix' assets/fish-approved-v7.css
          grep -q 'fish-approved-v7.css?v=7.3' assets/fish-refresh.js
          grep -q 'fish-refresh.js?v=7.3' index.html
          grep -q 'LURE_X_RATIO = 242 / 285' assets/sea.js
          grep -q "setAttribute('width','285')" assets/fish-refresh.js
      - name: Commit live rendering fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fish-approved-v7.css assets/fish-refresh.js assets/sea.js index.html
          git commit -m "Fix approved marine art at real site scale"
          git push origin HEAD:marine-v73-actual-size-fix
