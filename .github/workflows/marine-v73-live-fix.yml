name: Marine v7.3 live rendering fix

on:
  push:
    branches:
      - marine-v73-actual-size-fix
    paths:
      - .github/workflows/marine-v73-live-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marine-v73-actual-size-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Append v7.3 visual overrides
        run: |
          if ! grep -q 'v7.3: actual on-site scale/contrast fix' assets/fish-approved-v7.css; then
            echo '' | base64 -d >> assets/fish-approved-v7.css
          fi
      - name: Patch renderer and angler tracking
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/fish-refresh.js'); s=p.read_text(); s=s.replace('assets/fish-approved-v7.css?v=7.2','assets/fish-approved-v7.css?v=7.3')
          old="a.setAttribute('viewBox','0 0 285 195');\n      a.innerHTML=anglerArt();"; new="a.setAttribute('viewBox','0 0 285 195');\n      a.setAttribute('width','285');\n      a.setAttribute('height','195');\n      a.innerHTML=anglerArt();"; s=s.replace(old,new); p.write_text(s)
          p=Path('assets/sea.js'); s=p.read_text(); s=s.replace('var LURE_X = 150, LURE_Y = 14;','var LURE_X_RATIO = 242 / 285, LURE_Y_RATIO = 85 / 195;'); s=s.replace("angler.style.transform = 'translate(' + (lx - LURE_X * flip) + 'px,' + (ly - LURE_Y) + 'px) scaleX(' + flip + ')';", "var lureX = angler.clientWidth * LURE_X_RATIO, lureY = angler.clientHeight * LURE_Y_RATIO;\n      angler.style.transform = 'translate(' + (lx - lureX * flip) + 'px,' + (ly - lureY) + 'px) scaleX(' + flip + ')';"); p.write_text(s)
          p=Path('index.html'); p.write_text(p.read_text().replace('assets/fish-refresh.js?v=7.2','assets/fish-refresh.js?v=7.3'))
          PY
          node --check assets/fish-refresh.js
          node --check assets/sea.js
          grep -q 'v7.3: actual on-site scale/contrast fix' assets/fish-approved-v7.css
          grep -q 'fish-approved-v7.css?v=7.3' assets/fish-refresh.js
          grep -q 'fish-refresh.js?v=7.3' index.html
          grep -q 'LURE_X_RATIO = 242 / 285' assets/sea.js
          grep -q "setAttribute('width','285')" assets/fish-refresh.js
      - name: Commit live rendering fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fish-approved-v7.css assets/fish-refresh.js assets/sea.js index.html
          git commit -m "Fix approved marine art at real site scale"
          git push origin HEAD:marine-v73-actual-size-fix
