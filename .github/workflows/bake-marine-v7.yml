name: Bake approved marine v7 into primary renderer

on:
  push:
    branches: [marine-v7-baked-renderer]
    paths: [.github/workflows/bake-marine-v7.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marine-v7-baked-renderer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bake v7 into fish-refresh
        run: |
          node <<'NODE'
          const fs = require('fs');
          const refreshPath = 'assets/fish-refresh.js';
          const overlayPath = 'assets/fish-approved-v7.js';
          const indexPath = 'index.html';

          let refresh = fs.readFileSync(refreshPath, 'utf8');
          let overlay = fs.readFileSync(overlayPath, 'utf8');

          const loader = `\n  // Approved concept-art overlay: surface fish + angler only.\n  var approvedV7 = document.createElement('script');\n  approvedV7.src = 'assets/fish-approved-v7.js';\n  approvedV7.async = false;\n  document.head.appendChild(approvedV7);`;
          refresh = refresh.replace(loader, '');
          overlay = overlay.replace("style.href = 'assets/fish-approved-v7.css';", "style.href = 'assets/fish-approved-v7.css?v=7.2';");

          if (!refresh.includes('Approved concept-art overlay for the surface fish and abyss angler.')) {
            refresh = refresh.trimEnd() + '\n\n' + overlay.trim() + '\n';
          }
          fs.writeFileSync(refreshPath, refresh);

          let html = fs.readFileSync(indexPath, 'utf8');
          html = html.replace('<script src="assets/fish-refresh.js" defer></script>', '<script src="assets/fish-refresh.js?v=7.2" defer></script>');
          html = html.replace(/\n?<script src="assets\/fish-approved-v7\.js\?v=7\.1" defer><\/script>/, '');
          fs.writeFileSync(indexPath, html);
          NODE
          node --check assets/fish-refresh.js
          grep -q "critter.clown, .critter.tang" assets/fish-refresh.js
          grep -q "fish-refresh.js?v=7.2" index.html
          grep -q "fish-approved-v7.css?v=7.2" assets/fish-refresh.js
          ! grep -q "fish-approved-v7.js?v=7.1" index.html
      - name: Remove obsolete overlay JS and accidental anchor
        run: |
          rm -f assets/fish-approved-v7.js noop.txt
      - name: Commit baked renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bake approved marine v7 into primary renderer"
          git push origin HEAD:marine-v7-baked-renderer
