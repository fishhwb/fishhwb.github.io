name: Apply abyss transition fix
on:
  push:
    paths:
      - '.github/workflows/apply-abyss-transition-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add seamless abyss transition overrides
        shell: python
        run: |
          from pathlib import Path
          path = Path('assets/site-v2.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* ---------- seamless abyss transition ---------- */'
          if marker not in css:
              css += '''\n\n/* ---------- seamless abyss transition ---------- */\n.abyss{\n  background:\n    radial-gradient(ellipse at 50% 18%,rgba(29,95,124,.18) 0%,rgba(29,95,124,0) 52%),\n    linear-gradient(180deg,#071a31 0%,#06172b 24%,#04111f 58%,#030914 82%,#040d1c 100%);\n}\n.abyss .dark{\n  background:radial-gradient(circle 240px at var(--lx,50%) var(--ly,50%),rgba(1,2,8,0) 0 38%,rgba(1,2,8,.18) 62%,rgba(1,2,8,.44) 100%);\n  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 84%,transparent 100%);\n  mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 84%,transparent 100%);\n}\n.abyss .glow{\n  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 88%,transparent 100%);\n  mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 88%,transparent 100%);\n}\n'''
              path.write_text(css, encoding='utf-8')
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-abyss-transition-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-v2.css .github/workflows/apply-abyss-transition-fix.yml
          git commit -m "Smooth abyss depth transition"
          git push
