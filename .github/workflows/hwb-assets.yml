name: HWB asset safety
on:
  pull_request:
    paths:
      - 'assets/3d/**'
      - 'assets/gallery.json'
      - 'assets/site-v2.js'
      - 'assets/sea.js'
      - 'assets/hwb*.js'
      - 'hwb-tools/**'
      - 'tests/hwb-assets.test.cjs'
      - '.github/workflows/hwb-assets.yml'
  push:
    branches: [main]
    paths:
      - 'assets/3d/**'
      - 'assets/gallery.json'
      - 'assets/site-v2.js'
      - 'assets/sea.js'
      - 'assets/hwb*.js'
      - 'hwb-tools/**'
      - 'tests/hwb-assets.test.cjs'
      - '.github/workflows/hwb-assets.yml'
concurrency:
  group: hwb-asset-safety-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/site-v2.js
          node --check assets/sea.js
          node --check assets/hwb.js
          node --check assets/hwb-provenance.js
          node --check hwb-tools/tool.js
          node --check assets/hwb-inspection-notice.js
      - name: Check encrypted gallery publication
        run: node tests/hwb-assets.test.cjs
