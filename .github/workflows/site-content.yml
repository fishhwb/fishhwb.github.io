name: Build site content

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/scripts/build-site-content.mjs'
      - '.github/workflows/site-content.yml'
      - 'assets/3d/**'
      - 'assets/fishhwb-mascot.png'
      - 'assets/project-overrides.json'

permissions:
  contents: write

concurrency:
  group: site-content
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp

      - name: Optimize large site images
        shell: bash
        run: |
          if [ -f assets/fishhwb-mascot.png ]; then
            cwebp -quiet -q 84 -resize 768 0 assets/fishhwb-mascot.png -o assets/fishhwb-mascot.webp
          fi
          if [ -d assets/3d ]; then
            find assets/3d -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | while IFS= read -r -d '' image; do
              out="${image%.*}.webp"
              if [ ! -f "$out" ] || [ "$image" -nt "$out" ]; then
                cwebp -quiet -q 84 "$image" -o "$out" || true
              fi
            done
          fi

      - name: Build project hub, 3D index and sitemap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/build-site-content.mjs

      - name: Commit generated content
        shell: bash
        run: |
          if git diff --quiet -- assets/projects.json assets/gallery.json assets/3d assets/fishhwb-mascot.webp projects sitemap.xml; then
            echo "Generated content is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects.json assets/gallery.json assets/3d assets/fishhwb-mascot.webp projects sitemap.xml
          git commit -m "Refresh generated site content"
          git push
