name: Finish site fixes
on:
  push:
    paths:
      - '.github/workflows/site-finish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply project and VRChat fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/extras.js')
          s = p.read_text()
          s = s.replace("return !/\\.github\\.io$/i.test(r.name) && r.name!=='.github';", "return r.name!=='.github';")
          s = s.replace("'dedzedofficial/Blender-XR': 'Free, open-source VR mesh modelling and scene building inside Blender using a controller-first OpenXR workflow.'", "'dedzedofficial/Blender-XR': 'Free, open-source VR mesh modelling and scene building inside Blender using a controller-first OpenXR workflow.',\n      'fishhwb/fishhwb.github.io': 'The FISH HWB website and public project hub.'")
          s = s.replace("style.textContent='", "style.textContent='#projects{background:linear-gradient(#0a2440,#08203a);color:#eef4f5}.project{background:#07192e!important;color:#f4fbff!important;border-color:#d8efff!important}.project h3{color:#fff!important}.project p{color:#d9e8f2!important}.project .tags span{color:#fff!important;border-color:#9dc8e2!important}.project .button.alt{background:#f4fbff!important;color:#07192e!important;border-color:#f4fbff!important}.world-card{background:#07192e!important;color:#f4fbff!important;border-color:#9dc8e2!important}.world-card h4{color:#fff!important}.world-card p{color:#d9e8f2!important}.world-card small{color:#b9d5e5!important;opacity:1!important}")
          p.write_text(s)

          p = Path('.github/scripts/update-vrchat-worlds.mjs')
          s = p.read_text()
          needle = "const headers = {\n  Accept: 'application/json',\n  'User-Agent': 'FISHHWB-Website/1.0 (+https://github.com/fishhwb/fishhwb.github.io)'\n};"
          repl = needle + "\nconst authCookie = process.env.VRCHAT_AUTH_COOKIE || '';\nif (authCookie) headers.Cookie = authCookie.includes('auth=') ? authCookie : `auth=${authCookie}`;"
          if 'VRCHAT_AUTH_COOKIE' not in s:
              s = s.replace(needle, repl)
          s = s.replace("// Once an author ID is known, ask VRChat for all public worlds by that author.\n// If VRChat ever requires authentication for this search, the known seed list still works.", "// Once an author ID is known, ask VRChat for all public worlds by that author.\n// VRChat requires authentication for author enumeration, so the workflow can use VRCHAT_AUTH_COOKIE.\n// Individual known public worlds still refresh without authentication.")
          p.write_text(s)

          p = Path('.github/workflows/vrchat-worlds.yml')
          s = p.read_text()
          if 'VRCHAT_AUTH_COOKIE:' not in s:
              s = s.replace("  refresh:\n    runs-on: ubuntu-latest", "  refresh:\n    runs-on: ubuntu-latest\n    env:\n      VRCHAT_AUTH_COOKIE: ${{ secrets.VRCHAT_AUTH_COOKIE }}")
          p.write_text(s)
          PY
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/extras.js .github/scripts/update-vrchat-worlds.mjs .github/workflows/vrchat-worlds.yml
          git commit -m "Fix project contrast and VRChat discovery auth"
          git push
