name: Refresh VRChat worlds
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/update-vrchat-worlds.mjs'
      - '.github/scripts/discover-vrcdb-worlds.py'
      - '.github/workflows/vrchat-worlds.yml'
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: De-sync scheduled public API request
        if: github.event_name == 'schedule'
        shell: bash
        run: sleep $((RANDOM % 1800))
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover public worlds by author
        shell: bash
        run: |
          python -m pip install --quiet selenium
          python .github/scripts/discover-vrcdb-worlds.py /tmp/vrcdb-world-ids.json
      - name: Refresh and verify public world metadata
        env:
          VRCHAT_AUTH_COOKIE: ${{ secrets.VRCHAT_AUTH_COOKIE }}
          VRCHAT_DISCOVERY_FILE: /tmp/vrcdb-world-ids.json
        run: node .github/scripts/update-vrchat-worlds.mjs
      - name: Commit metadata changes
        shell: bash
        run: |
          if git diff --quiet -- assets/vrchat-worlds.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vrchat-worlds.json
          git commit -m "Refresh VRChat world metadata"
          git pull --rebase origin main
          git push
