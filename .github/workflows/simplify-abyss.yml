name: Simplify abyss section
on:
  push:
    paths:
      - '.github/workflows/simplify-abyss.yml'
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove relic extras and blend the abyss into the page
        shell: python
        run: |
          from pathlib import Path
          import re

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          start = index.find('  <div class="abyss"')
          end = index.find('  <section id="discord"', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate abyss section')
          abyss = index[start:end]
          angler = re.search(r'<svg class="angler"[\s\S]*?</svg>', abyss)
          if not angler:
              raise SystemExit('Could not preserve anglerfish')
          new_abyss = '  <div class="abyss" data-depth="3800" aria-hidden="true">\n    ' + angler.group(0) + '\n  </div>\n\n'
          index = index[:start] + new_abyss + index[end:]

          index, removed = re.subn(
              r'\n  <button class="chest"[\s\S]*?</button>',
              '',
              index,
              count=1,
          )
          if removed != 1:
              raise SystemExit('Could not remove treasure chest')
          index_path.write_text(index, encoding='utf-8')

          js_path = Path('assets/site-v2.js')
          js = js_path.read_text(encoding='utf-8')
          js = re.sub(
              r'\n    var relics=el\(\'button\',\'\',\'Seafloor log\'\);[\s\S]*?menu\.appendChild\(relics\);',
              '',
              js,
              count=1,
          )
          js, removed = re.subn(
              r'\n  /\* ---------- seabed relic hunt ---------- \*/[\s\S]*?(?=\n  /\* ---------- ambient life ---------- \*/)',
              '',
              js,
              count=1,
          )
          if removed != 1:
              raise SystemExit('Could not remove relic-hunt code')
          js = js.replace(
              'lazyMedia();renderGallery();setupRelics();addPlankton();useOptimizedMascot();',
              'lazyMedia();renderGallery();addPlankton();useOptimizedMascot();'
          )
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/site-v2.css')
          css = css_path.read_text(encoding='utf-8')
          css = re.sub(
              r'\n/\* ---------- abyss relic hunt ---------- \*/[\s\S]*?(?=\n/\* ---------- more realistic sea-life rendering ---------- \*/)',
              '',
              css,
              count=1,
          )
          css = re.sub(
              r'\n\n/\* ---------- seamless abyss transition ---------- \*/[\s\S]*$',
              '',
              css,
              count=1,
          )
          css += '''\n\n/* ---------- continuous abyss transition ---------- */\n.abyss{\n  height:clamp(360px,58vh,620px);\n  background:linear-gradient(180deg,#071a31 0%,#06162a 32%,#05111f 68%,#040d1c 100%);\n}\n'''
          css_path.write_text(css, encoding='utf-8')
      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/simplify-abyss.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/site-v2.js assets/site-v2.css .github/workflows/simplify-abyss.yml
          git commit -m "Simplify and smooth abyss section"
          git pull --rebase origin main
          git push
